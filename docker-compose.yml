services:
  motivator-bot:
    build: .
    container_name: motivator-bot
    restart: unless-stopped

    # Environment variables
    environment:
      # Bot configuration (set these in .env file)
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_USER_ID=${ADMIN_USER_ID:-}

      # AI configuration (optional - falls back to static content if unset)
      - AZURE_AI_ENDPOINT=${AZURE_AI_ENDPOINT:-}
      - AZURE_AI_DEPLOYMENT=${AZURE_AI_DEPLOYMENT:-}
      - AZURE_AI_API_KEY=${AZURE_AI_API_KEY:-}

      # Database lives on the mounted volume
      - DB_PATH=/data/motivator.db

      # Logging configuration
      - CONTAINER_ENV=true
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # File logging disabled in container (logs go to stdout/stderr)
      - LOG_FILE=

    # Mount data directory for database persistence
    volumes:
      - ./data:/data

    # Logging configuration for Docker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=motivator-bot"
        tag: "{{.Name}}/{{.ID}}"

